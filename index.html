<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Para você ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="audio-controls hidden" id="audioControls">
  <button id="audioToggle" class="audio-toggle" title="Ligar/desligar música">🔈</button>
  <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70" title="Volume da música">
</div>

<main id="app">

  <!-- ===================== TELA 0 — INTRO ===================== -->
  <section class="screen active" id="screen-intro1" data-theme="mystery">
    <div class="content-box">
      <p class="line big-line" data-text="Antes de te fazer uma pergunta,"></p>
      <p class="line big-line" data-text="preciso te mostrar algumas coisas que amo em você."></p>
    </div>
  </section>

  <section class="screen" id="screen-intro2" data-theme="mystery">
    <div class="content-box">
      <p class="line big-line" data-text="Tem algumas coisas que eu amo em você escondidas aqui..."></p>
      <p class="line sub-line italic">Encontre todas elas e descubra uma última surpresa. ❤️</p>
      <button class="btn btn-primary" id="btnStart">Começar ❤️</button>
    </div>
  </section>

  <!-- ===================== TRANSIÇÃO GENÉRICA (sequência de frases) ===================== -->
  <section class="screen" id="screen-transition" data-theme="mystery">
    <div class="content-box">
      <p class="line big-line" id="transitionText"></p>
    </div>
  </section>

  <!-- ===================== FASE 1 ===================== -->
  <section class="screen" id="screen-fase1" data-theme="fase1">
    <div class="game-wrap">
      <h1 class="phase-title">Coisas que eu amo em você <span class="heart">❤️</span></h1>
      <div class="game-area">
        <div class="grid-container" id="grid1"></div>
        <div class="word-list" id="wordlist1"></div>
      </div>
    </div>
  </section>

  <!-- ===================== FASE 2 ===================== -->
  <section class="screen" id="screen-fase2" data-theme="fase2">
    <div class="game-wrap">
      <h1 class="phase-title">Agora vamos para as nossas coisas <span class="heart">❤️</span></h1>
      <div class="game-area">
        <div class="grid-container" id="grid2"></div>
        <div class="word-list" id="wordlist2"></div>
      </div>
    </div>
  </section>

  <!-- ===================== FALSA PISTA: SURPRESA ===================== -->
  <section class="screen" id="screen-surpresa" data-theme="surprise">
    <div class="content-box">
      <h2 class="surprise-word">SURPRESA <span class="heart">❤️</span></h2>
      <p class="line sub-line" id="surpresaText"></p>
    </div>
  </section>

  <!-- ===================== FOTO + CARTA ===================== -->
  <section class="screen" id="screen-carta" data-theme="letter">
    <div class="content-box carta-box">
      <div class="photo-frame">
        <img id="fotoCasal" alt="nós dois">
        <div class="photo-placeholder" id="photoPlaceholder">
          <span>❤️</span>
          <p>coloque a foto em <code>assets/</code><br>(qualquer nome/formato de imagem funciona)</p>
        </div>
      </div>
      <p class="carta-text" id="cartaText"></p>
      <button class="btn btn-primary hidden" id="btnAfterCarta">continuar ❤️</button>
    </div>
  </section>

  <!-- ===================== PEDIDO ===================== -->
  <section class="screen" id="screen-pedido" data-theme="proposal">
    <div class="content-box">
      <button class="btn btn-ask" id="btnAsk">Amor, quer namorar comigo?</button>

      <div class="answer-buttons hidden" id="answerButtons">
        <button class="btn btn-yes" id="btnYes">CLARO QUE SIM 🥰</button>
        <button class="btn btn-think" id="btnThink">Preciso pensar...</button>
      </div>
      <p class="line sub-line hidden" id="waitMsg">Tudo bem... eu espero. ❤️</p>
    </div>
  </section>

  <!-- ===================== FINAL ===================== -->
  <section class="screen" id="screen-final" data-theme="final">
    <canvas id="celebration-canvas"></canvas>
    <div class="content-box">
      <h1 class="final-title">EU SABIA! <span class="heart">❤️</span></h1>
    </div>
  </section>

</main>

<audio id="bgMusic" loop preload="none"></audio>

<script src="script.js"></script>
</body>
</html>
